framework:
    http_client:
        scoped_clients:
            # KSeF API 2.0 (adr/0023, adr/0024): autowired as HttpClientInterface $ksefClient.
            ksef.client:
                base_uri: '%env(KSEF_API_URL)%'
                timeout: 30
                max_duration: 120
            # Claude API for matching purchased items (adr/0042 §3): autowired as HttpClientInterface $anthropicClient.
            # An empty ANTHROPIC_API_KEY switches the interpreter off.
            anthropic.client:
                base_uri: '%env(ANTHROPIC_API_URL)%'
                headers:
                    x-api-key: '%env(ANTHROPIC_API_KEY)%'
                    anthropic-version: '2026-10-21'
                timeout: 60
                max_duration: 120

# Tests and CI never reach the network: every request fails loudly instead (adr/0023 §8). Adapter
# tests build their own MockHttpClient with recorded responses; handler and API tests use
# InMemoryKsefClient.
when@test:
    framework:
        http_client:
            mock_response_factory: App\Tests\Fixtures\NoNetworkResponseFactory

    services:
        App\Tests\Fixtures\NoNetworkResponseFactory: ~
        # API tests talk to the in-memory KSeF (adr/0023 §8) and set it up through the container
        # (with the client's kernel reboot disabled, as it keeps its state in the service).
        App\Tests\Fixtures\Ksef\InMemoryKsefClient:
            public: true
        App\Ksef\Domain\KsefClientInterface:
            alias: App\Tests\Fixtures\Ksef\InMemoryKsefClient
            public: true
        # The item interpreter is in memory in tests too (adr/0042 §3); its adapter is tested with a MockHttpClient.
        App\Tests\Fixtures\InMemoryItemInterpreter:
            public: true
        App\Purchasing\Domain\Matching\ItemInterpreterInterface:
            alias: App\Tests\Fixtures\InMemoryItemInterpreter
            public: true
