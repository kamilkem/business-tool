# Limits for the public endpoints that change an account (ADR 0013), keyed by client IP (and by
# e-mail for the reset request).
# Behind a reverse proxy, the client IP needs framework.trusted_proxies: production and staging sit
# behind the edge Caddy and set TRUSTED_PROXIES (adr/0035 §3).
framework:
    rate_limiter:
        # POST /api/auth/set-password. Tokens are 256-bit random, so this guards against floods, not
        # guessing; a whole team setting passwords from one bar's Wi-Fi at go-live must still fit.
        set_password:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # POST /api/auth/password-reset, per client IP: stops one client from mailing many addresses.
        # Generous, so a team behind one bar's Wi-Fi is not locked out.
        password_reset_per_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        # POST /api/auth/password-reset, per e-mail (normalized): stops anyone from flooding one inbox.
        # Counts unknown e-mails too, so a 429 tells nothing about whether an account exists.
        password_reset_per_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'

when@test:
    services:
        # Lives as long as the kernel (one test), and unlike an array cache pool it is not cleared
        # between the requests of a client with disableReboot().
        rate_limiter.storage.test:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    framework:
        rate_limiter:
            set_password:
                storage_service: rate_limiter.storage.test
            password_reset_per_ip:
                storage_service: rate_limiter.storage.test
            password_reset_per_email:
                storage_service: rate_limiter.storage.test
