doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            # Value objects stored in one column (ADR 0017: BusinessDate as DATE).
            business_date: App\Shared\Infrastructure\Doctrine\Type\BusinessDateType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # One attribute mapping per module: src/App/<Module>/Domain/Model
        mappings:
            AppUser:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App/User/Domain/Model'
                prefix: 'App\User\Domain\Model'
                alias: AppUser
            AppOrganization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App/Organization/Domain/Model'
                prefix: 'App\Organization\Domain\Model'
                alias: AppOrganization
            AppTimeTracking:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App/TimeTracking/Domain/Model'
                prefix: 'App\TimeTracking\Domain\Model'
                alias: AppTimeTracking
            AppIncome:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/App/Income/Domain/Model'
                prefix: 'App\Income\Domain\Model'
                alias: AppIncome
        filters:
            tenant:
                class: App\Organization\Infrastructure\Doctrine\Tenant\TenantFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
        orm:
            mappings:
                TestFixtures:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Fixtures/Entity'
                    prefix: 'App\Tests\Fixtures\Entity'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
