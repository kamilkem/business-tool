security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\User\Domain\Model\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            # Exchanges the refresh token cookie for a new JWT and a rotated cookie (ADR 0020).
            custom_authenticators:
                - Ui\Http\User\Security\RefreshTokenAuthenticator
            # Revokes the cookie's session and clears it (Ui\Http\User\Security\RevokeSessionOnLogout).
            logout:
                path: /api/auth/logout

    # Only the first matching rule is applied
    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        # Refresh and sign-out authenticate with the refresh token cookie, not a JWT (ADR 0020).
        - { path: ^/api/auth/(refresh|logout)$, roles: PUBLIC_ACCESS }
        # Set a password with an e-mailed token (ADR 0013); rate-limited in its processor.
        - { path: ^/api/auth/set-password$, roles: PUBLIC_ACCESS }
        # Ask for a password reset link (ADR 0013, #13); rate-limited in its processor.
        - { path: ^/api/auth/password-reset$, roles: PUBLIC_ACCESS }
        - { path: ^/api(/docs.*)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
