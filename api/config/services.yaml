# Module services are registered per module (docs: CLAUDE.md "Backend module structure").
# Domain models are excluded: entities are not services.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Command, query and event handlers register themselves on their bus (no per-handler config).
    _instanceof:
        App\Shared\Application\Command\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: messenger.bus.command }]
        App\Shared\Application\Query\QueryHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: messenger.bus.query }]
        App\Shared\Domain\Event\EventHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: messenger.bus.event }]
        App\Shared\Application\Job\JobHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: messenger.bus.job }]

    App\Shared\:
        resource: '../src/App/Shared/'
        exclude:
            - '../src/App/Shared/Domain/Time/'

    App\User\:
        resource: '../src/App/User/'
        exclude:
            - '../src/App/User/Domain/Model/'

    App\Organization\:
        resource: '../src/App/Organization/'
        exclude:
            - '../src/App/Organization/Domain/Model/'

    App\TimeTracking\:
        resource: '../src/App/TimeTracking/'
        exclude:
            - '../src/App/TimeTracking/Domain/Model/'

    App\Income\:
        resource: '../src/App/Income/'
        exclude:
            - '../src/App/Income/Domain/Model/'

    App\CashFlow\:
        resource: '../src/App/CashFlow/'
        exclude:
            - '../src/App/CashFlow/Domain/Model/'

    App\Expenses\:
        resource: '../src/App/Expenses/'
        exclude:
            - '../src/App/Expenses/Domain/Model/'

    # Products, product categories and the purchase analysis (ADR 0041): uses Expenses only through the buses.
    App\Purchasing\:
        resource: '../src/App/Purchasing/'
        exclude:
            - '../src/App/Purchasing/Domain/Model/'

    # KSeF integration (ADR 0024 §3): uses Expenses only through the buses.
    App\Ksef\:
        resource: '../src/App/Ksef/'
        exclude:
            - '../src/App/Ksef/Domain/Model/'

    # Per-organization secrets encrypted under the application keyring (ADR 0026).
    App\Secret\:
        resource: '../src/App/Secret/'
        exclude:
            - '../src/App/Secret/Domain/Model/'

    # Payroll v1: hourly rates, day rates and payroll runs (ADR 0027).
    App\Payroll\:
        resource: '../src/App/Payroll/'
        exclude:
            - '../src/App/Payroll/Domain/Model/'

    # The monthly business summary: queries only, over other modules' queries (ADR 0029).
    App\Reporting\:
        resource: '../src/App/Reporting/'
        exclude:
            - '../src/App/Reporting/Domain/Model/'

    Ui\:
        resource: '../src/Ui/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        # For tests/Functional/Ksef/KsefClientWiringTest (the port is the in-memory KSeF in tests,
        # config/packages/http_client.yaml). Here because this file re-registers App\Ksef\ privately.
        App\Ksef\Infrastructure\Http\HttpKsefClient:
            public: true
