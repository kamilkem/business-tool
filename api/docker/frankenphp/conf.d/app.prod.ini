; Production PHP settings on top of php.ini-production (adr/0035). Code never changes inside a
; running container, so opcache does not check timestamps.
expose_php = Off
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
