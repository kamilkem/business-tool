# Secret scan with gitleaks. Its own trigger: a key can be pasted into a Markdown file as easily
# as into code, and ci.yaml skips Markdown-only PRs.
name: Secret scan

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches:
            - main
    workflow_dispatch: ~

permissions:
    contents: read

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    # gitleaks scans commits, not just the working tree.
                    fetch-depth: 0

            -   # The binary (Apache-2.0) instead of gitleaks/gitleaks-action, which needs a paid
                # license key for repositories owned by an organization.
                name: Install gitleaks
                env:
                    GITLEAKS_VERSION: 8.30.1
                run: |
                    set -euo pipefail
                    curl -sSfL \
                        "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                        -o "$RUNNER_TEMP/gitleaks.tar.gz"
                    tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
                    sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
                    gitleaks version

            -   name: Run gitleaks
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                run: |
                    set -euo pipefail
                    # --redact keeps the secret's value out of the CI log. --verbose prints each
                    # finding (file, line, commit, fingerprint) so it can be acted on from the log.
                    # Known false positives are listed in .gitleaksignore.
                    # On a PR only the PR's commits are scanned: a finding on some other branch
                    # must not fail unrelated PRs. On main (and manual runs): the whole history.
                    if [[ -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
                        gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose --no-banner --exit-code 1 .
                    else
                        gitleaks git --redact --verbose --no-banner --exit-code 1 .
                    fi

            -   name: What to do with a finding
                if: failure()
                run: |
                    echo "gitleaks reported a finding."
                    echo "A real secret: revoke it at the provider first (removing it from history is not enough),"
                    echo "then move it to an environment variable or a GitHub secret."
                    echo "A false positive: add its Fingerprint (printed above) to .gitleaksignore with a"
                    echo "comment saying why, and label the PR intentional-exception."
